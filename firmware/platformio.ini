; Firmware SOI 2.0.0: STM32F401 Black Pill sem STM32duino (HAL da ST + biblioteca USB Device da ST).
; A biblioteca USB Device (V2.11.6, licença em src/usb/LICENSE.md) está copiada em src/usb.
[env:blackpill_f401cc]
platform = ststm32
board = blackpill_f401cc
framework = stm32cube
upload_protocol = stlink
build_flags =
    -O2
    -Wall
    -I src/usb/Core/Inc
    -I src/usb/Class/CDC/Inc
